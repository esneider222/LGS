<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LGS — Iniciar sesión</title>
<meta name="theme-color" content="#1F4741">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F4741'/%3E%3Ctext x='32' y='42' font-size='24' font-weight='700' text-anchor='middle' fill='%23F5F2E6' font-family='Georgia,serif'%3ELGS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/bootstrap.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="card w-100" style="max-width:440px;"><div class="card-body p-4 p-md-5">
    <p class="eyebrow mb-1">LGS · Luz Guía Superior</p>
    <h1 class="h3 mb-1" style="font-family:var(--serif-display);">Ingresa a tu cuenta</h1>
    <p class="text-secondary small mb-4">Después elegirás la carrera y la universidad para las que quieres prepararte.</p>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label for="loginUser" class="form-label">Usuario</label><input id="loginUser" class="form-control" type="text" autocomplete="username" required></div>
      <div class="mb-3"><label for="loginPass" class="form-label">Contraseña</label><input id="loginPass" class="form-control" type="password" autocomplete="current-password" required></div>
      <div class="mb-3"><label for="capA" class="form-label">Verificación: resuelve <b id="capQ"></b></label>
        <div class="input-group"><input id="capA" class="form-control" type="text" inputmode="numeric"><button class="btn btn-outline" id="capNew" type="button" aria-label="Nueva suma">↻</button></div></div>
      <div class="alert alert-danger py-2 small d-none" id="loginErr" role="alert"></div>
      <button class="btn btn-oxblood w-100" type="submit">Ingresar</button>
    </form>
    <div class="alert alert-warning small mt-4 mb-0">Prototipo: aún no hay cuentas reales, así que cualquier usuario y contraseña permiten continuar.</div>
  </div></div>
</main>
<script src="lib/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/login.js"></script>
</body>
</html>
